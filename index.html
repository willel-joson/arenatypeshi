<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena God Tracker</title>
<style>
  :root {
    --bg: #0a1420;
    --panel: #0f1e2e;
    --panel2: #132638;
    --gold: #c8aa6e;
    --gold-bright: #f0e6d2;
    --blue: #0ac8b9;
    --blue-deep: #1e5a7a;
    --red: #e84057;
    --text: #a09b8c;
    --text-bright: #f0e6d2;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(ellipse at top, #14283c 0%, var(--bg) 60%);
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }

  header { text-align: center; padding: 20px 0 8px; }
  h1 {
    font-size: 2rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-bright);
    text-shadow: 0 0 20px rgba(200,170,110,.35);
  }
  .subtitle { color: var(--blue); font-size: .85rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

  /* Progress */
  .progress-panel {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid rgba(200,170,110,.35);
    border-radius: var(--radius);
    padding: 16px 20px; margin: 20px 0;
  }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-label { text-transform: uppercase; letter-spacing: 2px; font-size: .8rem; color: var(--gold); }
  .progress-count { font-size: 1.6rem; font-weight: 700; color: var(--gold-bright); }
  .progress-count small { color: var(--text); font-size: 1rem; }
  .bar-track {
    height: 14px; background: #081018; border-radius: 7px; overflow: hidden;
    border: 1px solid rgba(200,170,110,.25); position: relative;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--blue-deep), var(--blue));
    box-shadow: 0 0 12px rgba(10,200,185,.5);
    transition: width .4s ease;
  }
  .bar-fill.gold { background: linear-gradient(90deg, #785a28, var(--gold), var(--gold-bright)); box-shadow: 0 0 18px rgba(200,170,110,.7); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .search {
    flex: 1 1 220px; min-width: 180px;
    background: #081018; border: 1px solid rgba(200,170,110,.3);
    color: var(--text-bright); padding: 10px 14px; border-radius: var(--radius);
    font-size: .95rem; outline: none;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 8px rgba(10,200,185,.3); }
  .btn {
    background: var(--panel2); color: var(--text-bright);
    border: 1px solid rgba(200,170,110,.35);
    padding: 9px 14px; border-radius: var(--radius);
    cursor: pointer; font-size: .85rem; letter-spacing: .5px;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .btn.active { background: rgba(10,200,185,.15); border-color: var(--blue); color: var(--blue); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filter-chip {
    background: transparent; border: 1px solid rgba(160,155,140,.35);
    color: var(--text); padding: 6px 12px; border-radius: 14px;
    font-size: .8rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    transition: all .15s;
  }
  .filter-chip:hover { border-color: var(--gold); color: var(--gold-bright); }
  .filter-chip.active { background: rgba(200,170,110,.15); border-color: var(--gold); color: var(--gold-bright); }

  /* Grid */
  .grid {
    display: grid; gap: 10px-columns: repeat(auto-fill, minmax(96px, 1fr));
  }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: var(--radius);
    overflow: hidden; cursor: pointer; user-select: none;
    border: 2px solid transparent;
    background: var(--panel2);
    transition: transform .12s, border-color .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--blue); z-index: 2; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(5,10,16,.95));
    color: var(--text-bright); font-size: .72rem; text-align: center;
    padding: 14px 2px 4px; letter-spacing: .5px;
    pointer-events: none;
  }
  .tile:not(.done) img { filter: grayscale(1) brightness(.55); }
  .tile.done { border-color: var(--gold); box-shadow: 0 0 10px rgba(200,170,110,.4); }
  .tile .check {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #785a28, var(--gold));
    color: #0a1420; font-weight: 900; font-size: .8rem;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(200,170,110,.8);
  }
  .tile.done .check { display: flex; }
  .empty { text-align: center; padding: 40px; color: var(--text); grid-column: 1 / -1; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--gold);
    color: var(--gold-bright); padding: 12px 22px; border-radius: var(--radius);
    font-size: .9rem; opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

  /* Celebration */
  .celebrate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(5,10,16,.85); z-index: 200; text-align: center;
  }
  .celebrate.show { display: flex; }
  .celebrate h2 {
    font-size: 3rem; color: var(--gold-bright); text-transform: uppercase;
    letter-spacing: 6px; text-shadow: 0 0 30px rgba(200,170,110,.8);
    animation: pulse 1.2s ease-in-out infinite alternate;
  }
  .celebrate p { color: var(--blue); margin: 12px 0 24px; letter-spacing: 2px; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

  footer { text-align: center; margin-top: 40px; font-size: .75rem; color: #5c5a52; }

  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 7px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Arena God Tracker</h1>
    <div class="subtitle">Win an Arena game with 60 unique champions</div>
  </header>

  <div class="progress-panel">
    <div class="progress-row">
      <span class="progress-label">Progress to Arena God</span>
      <span class="progress-count"><span id="count">0</span><small> / 60</small></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
  </div>

  <div class="controls">
    <input type="text" class="search" id="search" placeholder="Search champions…">
    <button class="btn" id="btn-remaining">Show Remaining</button>
    <button class="btn" id="btn-done">Show Completed</button>
    <button class="btn" id="btn-export">Export</button>
    <button class="btn" id="btn-import">Import</button>
    <button class="btn" id="btn-reset">Reset All</button>
    <input type="file" id="file-input" accept=".json" hidden>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <footer>All wins are manually tracked and stored locally in your browser.</footer>
</div>

<div class="toast" id="toast"></div>

<div class="celebrate" id="celebrate">
  <h2>Arena God</h2>
  <p>You've won with 60 unique champions!</p>
  <button class="btn" onclick="document.getElementById('celebrate').classList.remove('show')">Continue</button>
</div>

<script>
"use strict";

/* Champion roster: [id, name, tags] — all roles per Data Dragon.
   NOTE: icons load from Data Dragon (ddragon.leagueoflegends.com). If you want

   /img folder. Data Dragon assets are effectively permanent (old patches stay up). */
const ICON_BASE = "img/";

const CHAMPS = [

["Aphelios","Aphelios",["Marksman"]],["Ashe","Ashe",["Marksman","Support"]],
["AurelionSol","Aurelion Sol",["Mage"]],["Aurora","Aurora",["Mage","Fighter"]],
["Azir","Azir",["Mage","Marksman"]],["Bard","Bard",["Support","Mage"]],
["Belveth","Bel'Veth",["Fighter","Assassin"]],["Blitzcrank","Blitzcrank",["Tank","Support"]],
["Brand","Brand",["Mage"]],["Braum","Braum",["Support","Tank"]],

["Draven","Draven",["Marksman"]],["DrMundo","Dr. Mundo",["Fighter","Tank"]],
["Ekko","Ekko",["Assassin","Fighter"]],["Elise","Elise",["Mage","Fighter"]],
["Evelynn","Evelynn",["Assassin","Mage"]],["Ezreal","Ezreal",["Marksman","Mage"]],
["Fiddlesticks","Fiddlesticks",["Mage","Support"]],["Fiora","Fiora",["Fighter","Assassin"]],
["Fizz","Fizz",["Assassin","Fighter"]],["Galio","Galio",["Tank","Mage"]],
["Gangplank","Gangplank",["Fighter"]],["Garen","Garen",["Fighter","Tank"]],
["Gnar","Gnar",["Fighter","Tank"]],["Gragas","Gragas",["Fighter","Mage"]],
["Graves","Graves",["Marksman"]],["Gwen","Gwen",["Fighter","Assassin"]],
["Hecarim","Hecarim",["Fighter","Tank"]],["Heimerdinger","Heimerdinger",["Mage","Support"]],
["Hwei","Hwei",["Mage"]],["Illaoi","Illaoi",["Fighter"]],
["Irelia","Irelia",["Fighter","Assassin"]],["Ivern","Ivern",["Support","Mage"]],
["Janna","Janna",["Support","Mage"]],["JarvanIV","Jarvan IV",["Tank","Fighter"]],
["Jax","Jax",["Fighter","Assassin"]],["Jayce","Jayce",["Fighter","Marksman"]],
["Jhin","Jhin",["Marksman","Assassin"]],["Jinx","Jinx",["Marksman"]],
["Kaisa","Kai'Sa",["Marksman"]],["Kalista","Kalista",["Marksman"]],
["Karma","Karma",["Mage","Support"]],["Karthus","Karthus",["Mage"]],
["Kassadin","Kassadin",["Mage","Assassin"]],["Katarina","Katarina",["Assassin","Mage"]],
["Kayle","Kayle",["Fighter","Support"]],["Kayn","Kayn",["Fighter","Assassin"]],

["Kindred","Kindred",["Marksman","Assassin"]],["Kled","Kled",["Fighter","Tank"]],
["KogMaw","Kog'Maw",["Marksman","Mage"]],["Leblanc","LeBlanc",["Assassin","Mage"]],
["LeeSin","Lee Sin",["Fighter","Assassin"]],["Leona","Leona",["Tank","Support"]],
["Lillia","Lillia",["Fighter","Mage"]],["Lissandra","Lissandra",["Mage"]],
["Lucian","Lucian",["Marksman"]],["Lulu","Lulu",["Support","Mage"]],
["Lux","Lux",["Mage","Support"]],["Malphite","Malphite",["Tank","Fighter"]],
["Malzahar","Malzahar",["Mage","Assassin"]],["Maokai","Maokai",["Tank","Mage"]],
["MasterYi","Master Yi",["Assassin","Fighter"]],["Milio","Milio",["Support","Mage"]],
["MissFortune","Miss Fortune",["Marksman"]],["Mordekaiser","Mordekaiser",["Fighter"]],
["Morgana","Morgana",["Mage","Support"]],["Naafiri","Naafiri",["Assassin"]],
["Nami","Nami",["Support","Mage"]],["Nasus","Nasus",["Fighter","Tank"]],
["Nautilus","Nautilus",["Tank","Fighter"]],["Neeko","Neeko",["Mage","Support"]],
["Nidalee","Nidalee",["Assassin","Mage"]],["Nilah","Nilah",["Assassin","Fighter"]],
["Nocturne","Nocturne",["Assassin","Fighter"]],["Nunu","Nunu & Willump",["Tank","Support"]],
["Olaf","Olaf",["Fighter","Assassin"]],["Orianna","Orianna",["Mage","Support"]],
["Ornn","Ornn",["Tank","Fighter"]],["Pantheon","Pantheon",["Fighter","Assassin"]],

["Renata","Renata Glasc",["Support"]],["Renekton","Renekton",["Fighter","Tank"]],
["Rengar","Rengar",["Assassin","Fighter"]],["Riven","Riven",["Fighter","Assassin"]],
["Rumble","Rumble",["Fighter","Mage"]],["Ryze","Ryze",["Mage","Fighter"]],
["Samira","Samira",["Marksman"]],["Sejuani","Sejuani",["Tank","Fighter"]],

["Shen","Shen",["Tank","Support"]],["Shyvana","Shyvana",["Fighter","Tank"]],
["Singed","Singed",["Tank","Fighter"]],["Sion","Sion",["Tank","Fighter"]],
["Sivir","Sivir",["Marksman"]],["Skarner","Skarner",["Fighter","Tank"]],
["Smolder","Smolder",["Marksman"]],["Sona","Sona",["Support","Mage"]],
["Soraka","Soraka",["Support","Mage"]],["Swain","Swain",["Mage","Support"]],
["Sylas","Sylas",["Mage","Fighter"]],["Syndra","Syndra",["Mage"]],
["TahmKench","Tahm Kench",["Support","Tank"]],["Taliyah","Taliyah",["Mage","Support"]],
["Talon","Talon",["Assassin"]],["Taric","Taric",["Support","Tank"]],
["Teemo","Teemo",["Marksman","Assassin"]],["Thresh","Thresh",["Support","Fighter"]],
["Tristana","Tristana",["Marksman","Assassin"]],["Trundle","Trundle",["Fighter","Tank"]],
["Tryndamere","Tryndamere",["Fighter","Assassin"]],["TwistedFate","Twisted Fate",["Mage","Assassin"]],
["Twitch","Twitch",["Marksman","Assassin"]],["Udyr","Udyr",["Fighter","Tank"]],
["Urgot","Urgot",["Fighter","Tank"]],["Varus","Varus",["Marksman","Mage"]],
["Vayne","Vayne",["Marksman","Assassin"]],["Veigar","Veigar",["Mage"]],
["Velkoz","Vel'Koz",["Mage"]],["Vex","Vex",["Mage"]],
["Vi","Vi",["Fighter","Assassin"]],["Viego","Viego",["Assassin","Fighter"]],
["Viktor","Viktor",["Mage"]],["Vladimir","Vladimir",["Mage"]],
["Volibear","Volibear",["Fighter","Tank"]],["Warwick","Warwick",["Fighter","Tank"]],
["Wukong","Wukong",["Fighter","Tank"]],["Xayah","Xayah",["Marksman"]],
["Xerath","Xerath",["Mage"]],["XinZhao","Xin Zhao",["Fighter","Assassin"]],
["Yasuo","Yasuo",["Fighter","Assassin"]],["Yone","Yone",["Assassin","Fighter"]],
["Yorick","Yorick",["Fighter","Tank"]],["Yuumi","Yuumi",["Support","Mage"]],
["Zac","Zac",["Tank","Fighter"]],["Zed","Zed",["Assassin"]],
["Zeri","Zeri",["Marksman"]],["Ziggs","Ziggs",["Mage"]],
["Zilean","Zilean",["Support","Mage"]],["Zoe","Zoe",["Mage","Support"]],
["Zyra","Zyra",["Mage","Support"]]
];

const ROLES = ["Assassin","Fighter","Mage","Marksman","Support","Tank"];
const GOAL = 60;
const KEY = "arenaGodTracker";

let wins = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let activeRoles = new Set();
let viewMode = "all"; // all | remaining | done
let query = "";

const $ = id => document.getElementById(id);

/* Build filter chips */
const filtersEl = $("filters");
ROLES.forEach(role => {
  const b = document.createElement("button");
  b.className = "filter-chip";
  b.textContent = role;
  b.onclick = () => {
    activeRoles.has(role) ? activeRoles.delete(role) : activeRoles.add(role);
    b.classList.toggle("active");
    render();
  };
  filtersEl.appendChild(b);
});

function visibleChamps() {
  return CHAMPS.filter(([, name, tags]) => {
    if (query && !name.toLowerCase().includes(query)) return false;
    if (activeRoles.size && !tags.some(t => activeRoles.has(t))) return false;
    const done = wins.has(name);
    if (viewMode === "done" && !done) return false;
    if (viewMode === "remaining" && done) return false;
    return true;
  });
}

function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  const list = visibleChamps();
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No champions match your filters.</div>';
    return;
  }
  for (const [id, name] of list) {
    const done = wins.has(name);
    const tile = document.createElement("div");
    tile.className = "tile" + (done ? " done" : "");
    tile.innerHTML =
      `<img loading="lazy" src="ICONBASE{ICON_BASE}ICONB​ASE{id}.png" alt="${name}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'?',style:'display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;color:#c8aa6e'}))">
       <div class="name">${name}</div><div class="check">✓</div>`;
    tile.onclick = () => toggle(name);
    grid.appendChild(tile);
  }
}

function toggle(name) {
  wins.has(name) ? wins.delete(name) : wins.add(name);
  localStorage.setItem(KEY, JSON.stringify([...wins]));
  render();
  const count = Math.min(wins.size, GOAL);
  $("count").textContent = count;
  const bar = $("bar");
  bar.style.width = (count / GOAL * 100) + "%";
  bar.classList.toggle("gold", wins.size >= GOAL);
  if (wins.size === GOAL) $("celebrate").classList.add("show");
}

/* Search */
$("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

/* View mode toggles (mutually exclusive) */
const btnRemaining = ("btn−remaining"),btnDone=("btn-remaining"), btnDone =("btn−remaining"),btnDone=("btn-done");
btnRemaining.onclick = () => {
  viewMode = viewMode === "remaining" ? "all" : "remaining";
  btnRemaining.classList.toggle("active", viewMode === "remaining");
  btnDone.classList.remove("active");
  render();
};
btnDone.onclick = () => {
  viewMode = viewMode === "done" ? "all" : "done";
  btnDone.classList.toggle("active", viewMode === "done");
  btnRemaining.classList.remove("active");
  render();
};

/* Export / Import */
$("btn-export").onclick = () => {
  const blob = new Blob(
    [JSON.stringify({ app: "arenaGodTracker", version: 1, wins: [...wins] }, null, 2)],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "arena-god-progress.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Progress exported.");
};
("btn−import").onclick=()=>("btn-import").onclick = () =>("btn−import").onclick=()=>("file-input").click();
$("file-input").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const valid = new Set(CHAMPS.map(c => c[1]));
      const imported = (data.wins || []).filter(n => valid.has(n));
      if (!Array.isArray(data.wins)) throw new Error();
      wins = new Set(imported);
      localStorage.setItem(KEY, JSON.stringify([...wins]));
      render();
      updateBar();
      toast(`Imported ${imported.length} wins.`);
    } catch {
      toast("Invalid backup file.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
};

/* Reset */
$("btn-reset").onclick = () => {
  if (confirm("Clear all tracked wins? This cannot be undone.")) {
    wins = new Set();
    localStorage.setItem(KEY, JSON.stringify([]));
    render();
    updateBar();
    toast("Progress cleared.");
  }
};

function updateBar() {
  const count = Math.min(wins.size, GOAL);
  $("count").textContent = count;
  $("bar").style.width = (count / GOAL * 100) + "%";
  $("bar").classList.toggle("gold", wins.size >= GOAL);
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

/* Init */
render();
updateBar();
</script>
</body>
</html>
